# ===================================================================
# CONFIGURACIÓN GENERAL DEL MICROSERVICIO DE VALIDACIÓN
# ===================================================================
spring.application.name=ms-validacion
server.port=8085

# ===================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (PostgreSQL - DB Validaciones)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_validaciones
spring.datasource.username=postgres
spring.datasource.password=tu_password_de_postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CONFIGURACIÓN DE EUREKA
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# URL del microservicio de preregistro para verificar el QR
ms.preregistro.url=http://ms-preregistro

# ===================================================================
# CONFIGURACIÓN DE LOGS
# ===================================================================
server.error.include-message=always
logging.level.root=INFO
logging.level.com.frontintel.aduanas.ms_validacion=DEBUG
